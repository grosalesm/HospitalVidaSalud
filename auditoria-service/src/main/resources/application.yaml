server:
  port: 8084

spring:
  application:
    name: auditoria-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/auditoria_db
    username: postgres
    password: 5416889
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  rabbitmq:
    exchange: hospital.eventos
    queue-auditoria: auditoria.cita-confirmada
    routing-key-cita-confirmada: cita.confirmada