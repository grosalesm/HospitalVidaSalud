server:
  port: 8084

spring:
  application:
    name: auditoria-service

  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  sql:
    init:
      mode: always

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  rabbitmq:
    exchange: hospital.eventos
    queue-auditoria: auditoria.cita-confirmada
    routing-key-cita-confirmada: cita.confirmada