server:
  port: 8082

spring:
  application:
    name: citas-service

  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  sql:
    init:
      mode: always

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  rabbitmq:
    exchange: hospital.eventos
    queue-notificaciones: notificaciones.cita-confirmada
    queue-auditoria: auditoria.cita-confirmada
    routing-key-cita-confirmada: cita.confirmada
    routing-key-cita-cancelada: cita.cancelada
    routing-key-cita-reprogramada: cita.reprogramada

webclient:
  pacientes:
    base-url: http://pacientes-service
    timeout: 5000
