server:
  port: 8081

spring:
  application:
    name: pacientes-service

  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/pacientes_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true