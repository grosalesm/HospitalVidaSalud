server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: pacientes-service
          uri: lb://pacientes-service
          predicates:
            - Path=/api/pacientes/**

        - id: citas-service
          uri: lb://citas-service
          predicates:
            - Path=/api/citas/**

        - id: notificaciones-service
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**

        - id: auditoria-service
          uri: lb://auditoria-service
          predicates:
            - Path=/api/auditoria/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true